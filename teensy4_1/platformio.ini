; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 本番ファームウェア: pio run -e teensy41 -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = 
	+<*> 
	-<test/*>
lib_deps = 
	adafruit/Adafruit TCS34725@^1.4.4
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.15

; ---- 以下は単体テスト用。本番の main.cpp はコンパイルしない ----
; 実行例: pio run -e gyro_test -t upload

[env:colorsensor_test]
extends = env:teensy41
build_src_filter = +<test/colorsensor_test.cpp>
lib_deps = adafruit/Adafruit TCS34725@^1.4.4

; BNO055 の生のオイラー角 (Wire1)
[env:gyro_test]
extends = env:teensy41
build_src_filter = +<test/gyro_test.cpp>
lib_deps =
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.15

; 坂判定の調整用（モーターは回さない）
[env:slope_log_test]
extends = env:teensy41
build_src_filter =
	+<Sensors.cpp>
	+<SlopeDetector.cpp>
	+<test/slope_log_test.cpp>

[env:motor_test]
extends = env:teensy41
build_src_filter =
	+<Motor.cpp>
	+<test/motor_test.cpp>
lib_deps =

; 上部 VL53 (RP2040 → Serial8) の受信確認
[env:upper_vl53_test]
extends = env:teensy41
build_src_filter =
	+<upperVL53.cpp>
	+<test/upper_vl53_test.cpp>
lib_deps =

; Teensy 4.1 と XIAO RP2040 間の UART 双方向通信（RP2040側: rp2040/teensy_uart_test）
[env:teensy_rp2040_uart_test]
extends = env:teensy41
build_src_filter = +<test/teensy_rp2040_uart_test.cpp>
lib_deps =

; UnitV とのUART通信（UnitV側: unitv/camera_uart_test.py）
[env:unitv_uart_test]
extends = env:teensy41
build_src_filter = +<test/unitv_uart_test.cpp>
lib_deps =

